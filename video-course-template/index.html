<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <img src="images/logo/GBL_VALVOLINE_LOGO_HORIZONTAL_RGB.png" alt="Valvoline Cummins" class="top-logo">
  <span class="heading-divider"></span>
  <h1 class="course-heading">{{TITLE}}</h1>
</div>

<div class="player-wrapper" id="playerWrapper">

  <!-- ── Completion screen ─────────────────────────────────────── -->
  <div id="completionScreen" class="overlay-screen hidden">
    <div class="overlay-card">
      <div class="overlay-icon">✓</div>
      <h2 class="overlay-title">Congratulations!</h2>
      <p class="overlay-sub">You have completed</p>
      <p class="overlay-course">{{TITLE}}</p>
      <p class="overlay-msg">
        Your completion has been recorded.<br>
        Click below to close the module and return to SAP Learning.
      </p>
      <div class="completion-badge"><span>Module Completed</span></div>
      <button class="primary-btn" onclick="finishAndClose()">✓ &nbsp;Mark as Complete</button>
    </div>
  </div>

  <div class="player-header">
    <div class="header-brand">{{BRAND}}</div>
    <div class="header-right">
      <div class="header-tag">Interactive Learning</div>
      <button class="fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg id="fsIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1.5 1h4v1.5h-2.5v2.5h-1.5v-4zm9 0h4v4h-1.5v-2.5h-2.5v-1.5zm-9 9h1.5v2.5h2.5v1.5h-4v-4zm11.5 2.5v-2.5h1.5v4h-4v-1.5h2.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="video-container">
    <video id="video" width="100%" controls playsinline
      controlsList="nodownload noplaybackrate nofullscreen">
      <source src="content/{{VIDEO}}" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

</div>

<script src="scorm.js"></script>
<script src="app.js"></script>
</body>
</html>
